[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
path_separator = os

# Chronological filenames keep the history readable straight from a directory listing.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# There is deliberately no sqlalchemy.url here. The connection string is a credential;
# migrations/env.py reads it from the environment so it never lands in a tracked file.

[post_write_hooks]
# Generated migrations go through the same linter and formatter as hand-written code, so
# a new revision never arrives with a lint failure attached.
hooks = ruff_fix,ruff_format
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
