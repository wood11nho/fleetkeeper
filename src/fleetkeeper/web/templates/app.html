{% extends "base.html" %}

{% block layout %}
<header class="topbar">
  <span class="topbar__brand">FleetKeeper</span>
  <form class="topbar__action" method="post" action="/iesire">
    <input type="hidden" name="{{ csrf_field }}" value="{{ csrf_token }}" />
    <button type="submit" class="button button--quiet">Ieșire</button>
  </form>
</header>

<main class="page">{% block content %}{% endblock %}</main>
{% endblock %}
