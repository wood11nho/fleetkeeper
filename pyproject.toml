[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fleetkeeper"
description = "Vehicle maintenance tracker with service interval predictions and email reminders"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Elias Stoica" }]
dynamic = ["version"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx2>=0.29",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[project.scripts]
fleetkeeper = "fleetkeeper.cli:main"

[tool.hatch.version]
path = "src/fleetkeeper/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetkeeper"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# The catalogue is prose: Romanian explanatory text reads worse split across lines than
# it does running past the margin, and autogenerated migrations embed long SQL literals.
"src/fleetkeeper/catalog/builtin.py" = ["E501"]
"migrations/versions/*" = ["E501"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "N",   # naming conventions
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
